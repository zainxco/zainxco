<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<style>
  .bg{fill:#161b22;stroke:#30363d;stroke-width:2}
  .t{font:22px monospace;fill:#c9d1d9;opacity:0;animation:show .15s forwards}
  .dim{fill:#8b949e}.blue{fill:#58a6ff}
  .cursor{fill:#58a6ff;animation:blink .75s steps(1) infinite}
  @keyframes show{to{opacity:1}} @keyframes blink{50%{opacity:0}}
  .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.8s}.l4{animation-delay:2.5s}
  .l5{animation-delay:3.2s}.l6{animation-delay:3.9s}.l7{animation-delay:4.6s}.l8{animation-delay:5.3s}
</style>
<rect class="bg" x="1" y="1" rx="18" width="898" height="428"/>
<circle cx="30" cy="28" r="6" fill="#ff5f56"/><circle cx="50" cy="28" r="6" fill="#ffbd2e"/><circle cx="70" cy="28" r="6" fill="#27c93f"/>
<text x="450" y="36" text-anchor="middle" class="t dim" style="opacity:1">ZAIN://PROFILE — terminal</text>
<text x="45" y="85" class="t l1"><tspan class="blue">$</tspan> whoami</text>
<text x="45" y="120" class="t l2">USER      ZAIN        CLASS     SOFTWARE DEVELOPER</text>
<text x="45" y="155" class="t l3">STUDY     COMPUTER SCIENCE     STATUS    [ ONLINE ]</text>
<text x="45" y="205" class="t l4"><tspan class="blue">$</tspan> cat current_missions.txt</text>
<text x="45" y="240" class="t l5">&gt; WEB + DESKTOP SYSTEMS</text>
<text x="45" y="275" class="t l6">&gt; AUTOMATION   /   EXPERIMENTAL SOFTWARE</text>
<text x="45" y="310" class="t l7">&gt; UI / PRODUCT DESIGN</text>
<text x="45" y="360" class="t l8"><tspan class="blue">$</tspan> echo "BUILD &gt; BREAK &gt; LEARN &gt; REPEAT"</text>
<rect x="45" y="385" width="12" height="23" class="cursor"/>
</svg>